services:
  battleship:
    image: ghcr.io/hackatoan/battleship:latest
    container_name: battleship
    restart: unless-stopped
    ports:
      - "3025:3025"
    environment:
      - PORT=3025
      - GAME_ID=battleship
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - default
      - games-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  games-net:
    external: true
